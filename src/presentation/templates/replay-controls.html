<div class="replay-control">
  <h3 class="head bright-copy">REPLAY</h3>
  <button type="button" aria-label="Pause replay" class="pause-button sprite-button-std">
    <span class="pause-icon sprite" aria-hidden="true"></span>
  </button>
  <button type="button" aria-label="Play replay" class="play-button sprite-button-std">
    <span class="play-icon sprite" aria-hidden="true"></span>
  </button>
  <div
    class="progress-bar"
    role="slider"
    tabindex="0"
    aria-label="Replay position"
    aria-valuemin="0"
    aria-valuemax="100"
    aria-valuenow="0"
  >
    <div class="progress-len"></div>
  </div>
  <span class="game-ui-slow-label">SLOW MOTION</span>
  <div class="shortcut-group no-drag">
    <div class="shortcut-item"><span class="kb">SPACE</span>PLAY/PAUSE</div>
    <div class="shortcut-item"><span class="kb">C</span>CAMERA</div>
  </div>
  <button type="button" aria-label="Close replay" class="close-button sprite-button-std">
    <span class="close-icon sprite" aria-hidden="true"></span>
  </button>
</div>
