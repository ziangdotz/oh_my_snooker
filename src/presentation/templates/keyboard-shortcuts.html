<div class="shortcuts-bar">
  <div class="shortcut-group no-drag stand-group">
    <div class="shortcut-item aim-key"><span class="kb">W</span>AIM</div>
    <div class="shortcut-item"><span class="kb">X</span>CROUCH</div>
    <div class="shortcut-item pickup-key"><span class="kb">P</span>PLACE BALL</div>
  </div>
  <div class="shortcut-group no-drag aim-group">
    <div class="shortcut-item"><span class="kb">S</span>STAND</div>
    <div class="shortcut-item"><span class="kb">SPACE</span>SHOT</div>
    <div class="shortcut-item">
      <span class="kb assi-key">Alt</span><span class="plus-icon sprite"></span
      ><span class="m-d-i sprite"></span>ADD SPIN
    </div>
    <div class="shortcut-item"><span class="kb">C</span>CLEAR SPIN</div>
    <div class="shortcut-item"><span class="m-w-i sprite"></span>SET POWER</div>
    <div class="shortcut-item">
      <span class="kb assi-key">Alt</span><span class="plus-icon sprite"></span
      ><span class="m-w-i sprite"></span>ELEVATION
    </div>
  </div>
  <button type="button" class="more-button" aria-label="Open controls guide">CONTROLS</button>
</div>
