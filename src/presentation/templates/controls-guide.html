<section class="control-guide-section">
  <h3 class="subhead-section">GENERAL</h3>
  <section class="basic-controls-img"></section>
</section>
<section class="control-guide-section">
  <h3 class="subhead-section">STANDING</h3>
  <dl class="control-guide-list">
    <div class="control-guide-row">
      <dt>AIM</dt>
      <dd class="control-guide-input"><kbd class="kb">W</kbd></dd>
      <dd class="control-guide-condition">WHEN YOUR TURN</dd>
    </div>
    <div class="control-guide-row">
      <dt>CROUCH</dt>
      <dd class="control-guide-input"><kbd class="kb">X</kbd></dd>
    </div>
    <div class="control-guide-row">
      <dt>PLACE BALL</dt>
      <dd class="control-guide-input"><kbd class="kb">P</kbd></dd>
      <dd class="control-guide-condition">WHEN BALL IN HAND</dd>
    </div>
  </dl>
</section>
<section class="control-guide-section">
  <h3 class="subhead-section">AIMING</h3>
  <dl class="control-guide-list">
    <div class="control-guide-row">
      <dt>SHOOT</dt>
      <dd class="control-guide-input"><kbd class="kb">SPACE</kbd></dd>
    </div>
    <div class="control-guide-row">
      <dt>ADD SPIN</dt>
      <dd class="control-guide-input">
        <kbd class="kb assi-key">Alt</kbd
        ><span class="control-guide-plus" aria-label="plus">+</span>
        <span class="m-d-i sprite" aria-hidden="true"></span><span>DRAG</span>
      </dd>
    </div>
    <div class="control-guide-row">
      <dt>CLEAR SPIN</dt>
      <dd class="control-guide-input"><kbd class="kb">C</kbd></dd>
    </div>
    <div class="control-guide-row">
      <dt>SET POWER</dt>
      <dd class="control-guide-input">
        <span class="m-w-i sprite" aria-hidden="true"></span><span>SCROLL</span>
      </dd>
    </div>
    <div class="control-guide-row">
      <dt>ELEVATION</dt>
      <dd class="control-guide-input">
        <kbd class="kb assi-key">Alt</kbd
        ><span class="control-guide-plus" aria-label="plus">+</span>
        <span class="m-w-i sprite" aria-hidden="true"></span><span>SCROLL</span>
      </dd>
    </div>
    <div class="control-guide-row">
      <dt>STAND</dt>
      <dd class="control-guide-input"><kbd class="kb">S</kbd></dd>
    </div>
  </dl>
</section>
