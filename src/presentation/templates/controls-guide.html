<section>
  <h3 class="subhead-section">GENERAL</h3>
  <section class="basic-controls-img"></section>
</section>
<section>
  <h3 class="subhead-section">STANDING</h3>
  <section class="flex-section ss-s ali-ms46">
    <label>AIM</label>
    <div class="shortcut-item">
      <span class="kb">W</span><span class="ps"> (WHEN YOUR TURN)</span>
    </div>
  </section>
  <section class="flex-section ss-s ali-ms46">
    <label>CROUCH</label>
    <div class="shortcut-item"><span class="kb">X</span></div>
  </section>
  <section class="flex-section ss-s ali-ms46">
    <label>PLACE BALL</label>
    <div class="shortcut-item">
      <span class="kb">P</span><span class="ps"> (WHEN BALL IN HAND)</span>
    </div>
  </section>
</section>
<section>
  <h3 class="subhead-section">AIMING</h3>
  <section class="flex-section ss-s ali-ms46">
    <label>SHOT</label>
    <div class="shortcut-item"><span class="kb">SPACE</span></div>
  </section>
  <section class="flex-section ss-s ali-ms46">
    <label>ADD SPIN</label>
    <div class="shortcut-item">
      <span class="kb assi-key">Alt</span><span class="plus-icon sprite"></span
      ><span class="m-d-i sprite"></span>
    </div>
  </section>
  <section class="flex-section ss-s ali-ms46">
    <label>CLEAR SPIN</label>
    <div class="shortcut-item"><span class="kb">C</span></div>
  </section>
  <section class="flex-section ss-s ali-ms46">
    <label>SET POWER</label>
    <div class="shortcut-item"><span class="m-w-i sprite"></span></div>
  </section>
  <section class="flex-section ss-s ali-ms46">
    <label>ELEVATION</label>
    <div class="shortcut-item">
      <span class="kb assi-key">Alt</span><span class="plus-icon sprite"></span
      ><span class="m-w-i sprite"></span>
    </div>
  </section>
  <section class="flex-section ss-s ali-ms46">
    <label>STAND</label>
    <div class="shortcut-item"><span class="kb">S</span></div>
  </section>
</section>
